<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MASUM XO Celebration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at top,#32105c,#100019 60%,#030005);

    color:white;
    overflow:hidden;
}


/* MAIN GAME */

.game{
    width:390px;
    max-width:94%;
    padding:28px 20px;

    text-align:center;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    border-radius:28px;

    backdrop-filter:blur(18px);

    box-shadow:
    0 25px 80px rgba(0,0,0,.6);

    z-index:5;
}

h1{
    font-size:38px;
    margin-bottom:4px;
}

.brand{
    color:#aaa;
    letter-spacing:5px;
    font-size:12px;
    margin-bottom:20px;
}


/* SCORE */

.score-board{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:18px;
}

.score{
    min-width:100px;
    padding:10px 20px;

    background:rgba(255,255,255,.08);

    border-radius:15px;
}

.score span{
    display:block;
    font-size:28px;
    font-weight:bold;
}

.x-score span{
    color:#ff4d6d;
}

.o-score span{
    color:#4dabf7;
}


/* STATUS */

#status{
    font-size:18px;
    font-weight:bold;
    margin-bottom:16px;
}


/* BOARD */

.board{
    width:300px;
    height:300px;

    max-width:100%;

    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:10px;
}

.cell{
    border:none;
    border-radius:18px;

    background:rgba(255,255,255,.10);

    color:white;

    font-size:55px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.cell:hover{
    transform:scale(1.04);
    background:rgba(255,255,255,.18);
}

.cell.x{
    color:#ff4d6d;
    text-shadow:0 0 25px #ff4d6d;
}

.cell.o{
    color:#4dabf7;
    text-shadow:0 0 25px #4dabf7;
}


/* WINNING CELLS */

.cell.winner{
    animation:
    winnerGlow .5s infinite alternate;
}

@keyframes winnerGlow{

    from{
        transform:scale(1);
        box-shadow:0 0 10px currentColor;
    }

    to{
        transform:scale(1.1);
        box-shadow:
        0 0 35px currentColor,
        0 0 60px currentColor;
    }

}


/* BUTTON */

.new-game{
    margin-top:22px;

    padding:13px 30px;

    border:none;
    border-radius:30px;

    background:
    linear-gradient(135deg,#ff4d6d,#7b2ff7);

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.new-game:hover{
    transform:scale(1.07);
}


/* CELEBRATION */

.celebration{
    position:fixed;

    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(5px);

    opacity:0;
    visibility:hidden;

    transition:.3s;

    z-index:20;
}

.celebration.show{
    opacity:1;
    visibility:visible;
}


/* WINNER BOX */

.win-box{
    width:340px;
    max-width:90%;

    padding:40px 25px;

    text-align:center;

    border-radius:30px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.18),
        rgba(255,255,255,.06)
    );

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 0 80px rgba(255,255,255,.15);

    transform:scale(.5);

    transition:.5s;
}

.celebration.show .win-box{
    transform:scale(1);

    animation:
    winnerPop .7s ease;
}

@keyframes winnerPop{

    0%{
        transform:scale(.3) rotate(-8deg);
    }

    70%{
        transform:scale(1.1) rotate(3deg);
    }

    100%{
        transform:scale(1) rotate(0);
    }

}


.trophy{
    font-size:65px;

    animation:
    trophyBounce .7s infinite alternate;
}

@keyframes trophyBounce{

    from{
        transform:translateY(0) rotate(-5deg);
    }

    to{
        transform:translateY(-12px) rotate(5deg);
    }

}


#winTitle{
    font-size:45px;

    margin:10px 0;

    background:
    linear-gradient(
        90deg,
        #ff4d6d,
        #ffd43b,
        #4dabf7,
        #b197fc
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:titleGlow 1s infinite alternate;
}

@keyframes titleGlow{

    from{
        filter:drop-shadow(0 0 2px white);
    }

    to{
        filter:drop-shadow(0 0 15px white);
    }

}


.congrats{
    font-size:20px;
    margin-bottom:20px;
}


/* CONFETTI */

.confetti{
    position:fixed;

    width:10px;
    height:18px;

    top:-30px;

    z-index:30;

    animation:
    fall linear forwards;
}

@keyframes fall{

    0%{
        transform:
        translateY(-30px)
        rotate(0deg);
    }

    100%{
        transform:
        translateY(110vh)
        rotate(720deg);
    }

}


/* FIREWORK */

.firework{
    position:fixed;

    width:6px;
    height:6px;

    border-radius:50%;

    z-index:25;

    animation:
    explode 1s ease-out forwards;
}

@keyframes explode{

    0%{
        transform:
        translate(0,0)
        scale(1);

        opacity:1;
    }

    100%{
        transform:
        translate(var(--x),var(--y))
        scale(.2);

        opacity:0;
    }

}


/* MOBILE */

@media(max-width:450px){

    .game{
        padding:24px 15px;
    }

    h1{
        font-size:32px;
    }

    .board{
        width:280px;
        height:280px;
    }

    .cell{
        font-size:48px;
    }

    #winTitle{
        font-size:38px;
    }

}

</style>
</head>


<body>


<!-- GAME -->

<div class="game">

    <h1>❌ Tic Tac Toc ⭕</h1>

    <div class="brand">
        GAME
    </div>


    <div class="score-board">

        <div class="score x-score">
            X
            <span id="scoreX">0</span>
        </div>

        <div class="score o-score">
            O
            <span id="scoreO">0</span>
        </div>

    </div>


    <div id="status">
        X's Turn
    </div>


    <div class="board">

        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>

    </div>


    <button class="new-game" onclick="newGame()">
        🔄 New Game
    </button>

</div>



<!-- CELEBRATION -->

<div class="celebration" id="celebration">

    <div class="win-box">

        <div class="trophy">
            🏆
        </div>

        <div id="winTitle">
            X WINS!
        </div>

        <div class="congrats">
            🎉 Congratulations! 🎉
        </div>

        <button class="new-game" onclick="newGame()">
            🎮 Play Again
        </button>

    </div>

</div>



<script>


/* GAME VARIABLES */

let board = Array(9).fill("");

let currentPlayer = "X";

let gameOver = false;

let scoreX = 0;

let scoreO = 0;


const cells =
document.querySelectorAll(".cell");

const statusText =
document.getElementById("status");

const scoreXText =
document.getElementById("scoreX");

const scoreOText =
document.getElementById("scoreO");

const celebration =
document.getElementById("celebration");


/* WINNING PATTERNS */

const winningPatterns = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];



/* PLAY */

function play(index){

    if(board[index] !== "" || gameOver){
        return;
    }


    board[index] = currentPlayer;

    cells[index].textContent =
    currentPlayer;

    cells[index].classList.add(
        currentPlayer.toLowerCase()
    );


    const winner =
    checkWinner();


    /* WIN */

    if(winner){

        gameOver = true;


        winner.forEach(index => {

            cells[index]
            .classList.add("winner");

        });


        if(currentPlayer === "X"){

            scoreX++;

            scoreXText.textContent =
            scoreX;

        }

        else{

            scoreO++;

            scoreOText.textContent =
            scoreO;

        }


        statusText.innerHTML =
        "🎉 " + currentPlayer + " Wins!";


        /* START CELEBRATION */

        setTimeout(() => {

            showCelebration(currentPlayer);

        },500);


        return;
    }


    /* DRAW */

    if(!board.includes("")){

        gameOver = true;

        statusText.innerHTML =
        "🤝 Game Draw!";

        return;
    }


    /* CHANGE PLAYER */

    currentPlayer =
    currentPlayer === "X"
    ? "O"
    : "X";


    statusText.innerHTML =
    currentPlayer + "'s Turn";

}



/* CHECK WINNER */

function checkWinner(){

    for(let pattern of winningPatterns){

        const a = pattern[0];

        const b = pattern[1];

        const c = pattern[2];


        if(

            board[a] !== "" &&

            board[a] === board[b] &&

            board[a] === board[c]

        ){

            return pattern;

        }

    }

    return null;

}



/* CELEBRATION */

function showCelebration(player){

    document.getElementById("winTitle")
    .textContent =
    player + " WINS!";


    celebration
    .classList
    .add("show");


    /* CONFETTI */

    createConfetti();


    /* FIREWORKS */

    createFirework(20,30);

    setTimeout(() => {
        createFirework(80,25);
    },300);

    setTimeout(() => {
        createFirework(50,20);
    },600);

}



/* CONFETTI */

function createConfetti(){

    for(let i=0;i<120;i++){

        const confetti =
        document.createElement("div");

        confetti.className =
        "confetti";


        confetti.style.left =
        Math.random()*100 + "vw";


        confetti.style.animationDuration =
        (Math.random()*3+2) + "s";


        confetti.style.animationDelay =
        Math.random()*1.5 + "s";


        const colors = [

            "#ff4d6d",
            "#ffd43b",
            "#4dabf7",
            "#69db7c",
            "#b197fc",
            "#ffffff"

        ];


        confetti.style.background =
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];


        document.body.appendChild(confetti);


        setTimeout(() => {

            confetti.remove();

        },6000);

    }

}



/* FIREWORK */

function createFirework(x,y){

    for(let i=0;i<35;i++){

        const fire =
        document.createElement("div");


        fire.className =
        "firework";


        fire.style.left =
        x + "vw";

        fire.style.top =
        y + "vh";


        const angle =
        Math.random()*Math.PI*2;


        const distance =
        Math.random()*150 + 60;


        fire.style.setProperty(
            "--x",
            Math.cos(angle)*distance + "px"
        );


        fire.style.setProperty(
            "--y",
            Math.sin(angle)*distance + "px"
        );


        const colors = [

            "#ff4d6d",
            "#ffd43b",
            "#4dabf7",
            "#69db7c",
            "#b197fc",
            "#ffffff"

        ];


        fire.style.background =
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];


        fire.style.boxShadow =
        "0 0 12px currentColor";


        document.body.appendChild(fire);


        setTimeout(() => {

            fire.remove();

        },1200);

    }

}



/* NEW GAME */

function newGame(){

    board =
    Array(9).fill("");

    currentPlayer = "X";

    gameOver = false;


    cells.forEach(cell => {

        cell.textContent = "";

        cell.classList.remove(
            "x",
            "o",
            "winner"
        );

    });


    statusText.innerHTML =
    "X's Turn";


    celebration
    .classList
    .remove("show");

}


</script>

</body>
</html>
